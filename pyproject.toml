[project]
name = "safe-ftp-deploy"
version = "0.1.0"
description = "Safety-first FTP deploy tool with drift detection and a no-delete guarantee, built to be safe to hand to an AI agent."
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "rich>=13.0.0",
]

[project.scripts]
safe-ftp-deploy = "safe_ftp:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["safe_ftp", "safe_ftp_format"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
