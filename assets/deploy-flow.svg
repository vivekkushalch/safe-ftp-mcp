<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Deploy pipeline: five checks that can stop a deploy, then rename, upload, verify and record">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .gate { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .step { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.3; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.3; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.3; }
      .purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.3; }
      .t { fill: #0f172a; font-size: 13px; font-weight: 600; }
      .n { fill: #2563eb; font-size: 11px; font-weight: 700; }
      .m { fill: #334155; font-size: 11.5px; font-family: ui-monospace, Consolas, Menlo, monospace; }
      .s { fill: #64748b; font-size: 11px; }
      .h { fill: #64748b; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .ah { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .gate { fill: #0f2a4a; stroke: #58a6ff; }
        .step { fill: #161b22; stroke: #484f58; }
        .ok { fill: #0b2e1a; stroke: #3fb950; }
        .red { fill: #3a1315; stroke: #f85149; }
        .amber { fill: #33260a; stroke: #d29922; }
        .gray { fill: #1c2128; stroke: #6e7681; }
        .purple { fill: #271a3d; stroke: #a371f7; }
        .t { fill: #f0f6fc; }
        .n { fill: #58a6ff; }
        .m { fill: #c9d1d9; }
        .s, .h { fill: #8b949e; }
        .ln { stroke: #8b949e; }
        .ah { fill: #8b949e; }
      }
    </style>
  </defs>
  <rect class="bg" width="900" height="360" rx="10"/>
  <text class="h" x="12" y="20">CHECKS: NOTHING IS WRITTEN YET</text>

  <rect class="red" x="10" y="32" width="160" height="28" rx="14"/>
  <text class="m" x="90" y="50" text-anchor="middle">error</text>
  <line class="ln" x1="90" y1="84" x2="90" y2="62" marker-end="url(#ar)"/>
  <rect class="gate" x="10" y="86" width="160" height="62" rx="8"/>
  <text class="n" x="22" y="104">1</text>
  <text class="t" x="90" y="116" text-anchor="middle">Local file</text>
  <text class="t" x="90" y="134" text-anchor="middle">exists?</text>
  <line class="ln" x1="170" y1="117" x2="190" y2="117" marker-end="url(#ar)"/>
  <rect class="red" x="190" y="32" width="160" height="28" rx="14"/>
  <text class="m" x="270" y="50" text-anchor="middle">blocked</text>
  <line class="ln" x1="270" y1="84" x2="270" y2="62" marker-end="url(#ar)"/>
  <rect class="gate" x="190" y="86" width="160" height="62" rx="8"/>
  <text class="n" x="202" y="104">2</text>
  <text class="t" x="270" y="116" text-anchor="middle">Remote path on</text>
  <text class="t" x="270" y="134" text-anchor="middle">the whitelist?</text>
  <line class="ln" x1="350" y1="117" x2="370" y2="117" marker-end="url(#ar)"/>
  <rect class="gray" x="370" y="32" width="160" height="28" rx="14"/>
  <text class="m" x="450" y="50" text-anchor="middle">no_change</text>
  <line class="ln" x1="450" y1="84" x2="450" y2="62" marker-end="url(#ar)"/>
  <rect class="gate" x="370" y="86" width="160" height="62" rx="8"/>
  <text class="n" x="382" y="104">3</text>
  <text class="t" x="450" y="116" text-anchor="middle">Remote differs</text>
  <text class="t" x="450" y="134" text-anchor="middle">from local?</text>
  <line class="ln" x1="530" y1="117" x2="550" y2="117" marker-end="url(#ar)"/>
  <rect class="amber" x="550" y="32" width="160" height="28" rx="14"/>
  <text class="m" x="630" y="50" text-anchor="middle">stale_download</text>
  <line class="ln" x1="630" y1="84" x2="630" y2="62" marker-end="url(#ar)"/>
  <rect class="gate" x="550" y="86" width="160" height="62" rx="8"/>
  <text class="n" x="562" y="104">4</text>
  <text class="t" x="630" y="116" text-anchor="middle">Matches</text>
  <text class="t" x="630" y="134" text-anchor="middle">--expected-hash?</text>
  <line class="ln" x1="710" y1="117" x2="730" y2="117" marker-end="url(#ar)"/>
  <rect class="amber" x="730" y="32" width="160" height="28" rx="14"/>
  <text class="m" x="810" y="50" text-anchor="middle">drift_detected</text>
  <line class="ln" x1="810" y1="84" x2="810" y2="62" marker-end="url(#ar)"/>
  <rect class="gate" x="730" y="86" width="160" height="62" rx="8"/>
  <text class="n" x="742" y="104">5</text>
  <text class="t" x="810" y="116" text-anchor="middle">Matches last</text>
  <text class="t" x="810" y="134" text-anchor="middle">deployed hash?</text>
  <text class="s" x="720" y="166" text-anchor="middle">--force skips checks 4 and 5</text>
  <path class="ln" d="M810 148 V184 H90 V216" marker-end="url(#ar)"/>
  <text class="s" x="450" y="178" text-anchor="middle" style="font-weight:600">all checks pass</text>
  <text class="h" x="220" y="208">WRITES: ONLY WITH --EXECUTE</text>
  <rect class="gate" x="25" y="218" width="130" height="62" rx="8"/>
  <text class="t" x="90" y="244" text-anchor="middle">--execute</text>
  <text class="t" x="90" y="262" text-anchor="middle">given?</text>
  <text class="s" x="167" y="241" text-anchor="middle">yes</text>
  <rect class="step" x="179" y="218" width="125" height="62" rx="8"/>
  <text class="t" x="241" y="244" text-anchor="middle">Rename remote</text>
  <text class="t" x="241" y="262" text-anchor="middle">file to backup</text>
  <rect class="step" x="328" y="218" width="125" height="62" rx="8"/>
  <text class="t" x="390" y="244" text-anchor="middle">Upload</text>
  <text class="t" x="390" y="262" text-anchor="middle">new file</text>
  <rect class="step" x="477" y="218" width="125" height="62" rx="8"/>
  <text class="t" x="539" y="244" text-anchor="middle">Download again,</text>
  <text class="t" x="539" y="262" text-anchor="middle">compare hashes</text>
  <rect class="step" x="626" y="218" width="125" height="62" rx="8"/>
  <text class="t" x="688" y="244" text-anchor="middle">Save hash and</text>
  <text class="t" x="688" y="262" text-anchor="middle">history entry</text>
  <line class="ln" x1="155" y1="249" x2="179" y2="249" marker-end="url(#ar)"/>
  <line class="ln" x1="304" y1="249" x2="328" y2="249" marker-end="url(#ar)"/>
  <line class="ln" x1="453" y1="249" x2="477" y2="249" marker-end="url(#ar)"/>
  <line class="ln" x1="602" y1="249" x2="626" y2="249" marker-end="url(#ar)"/>
  <line class="ln" x1="751" y1="249" x2="775" y2="249" marker-end="url(#ar)"/>
  <rect class="ok" x="775" y="226" width="100" height="46" rx="23"/>
  <text class="m" x="825" y="254" text-anchor="middle" style="font-weight:700">success</text>
  <line class="ln" x1="90" y1="280" x2="90" y2="304" marker-end="url(#ar)"/>
  <rect class="purple" x="25" y="306" width="130" height="28" rx="14"/>
  <text class="m" x="90" y="324" text-anchor="middle">dry_run</text>
  <text class="s" x="90" y="350" text-anchor="middle">no: print the plan</text>
  <line class="ln" x1="540" y1="280" x2="540" y2="304" marker-end="url(#ar)"/>
  <rect class="red" x="430" y="306" width="220" height="28" rx="14"/>
  <text class="m" x="540" y="324" text-anchor="middle">upload_verification_failed</text>
  <text class="s" x="540" y="350" text-anchor="middle">hash mismatch: old file stays under its backup name</text>
</svg>
